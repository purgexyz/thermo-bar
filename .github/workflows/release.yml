name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (needs .NET 8 Desktop Runtime)
        shell: pwsh
        run: |
          .\build.ps1
          Move-Item dist\TempBar.exe TempBar-win-x64.exe

      - name: Build (self-contained)
        shell: pwsh
        run: |
          .\build.ps1 -SelfContained
          Move-Item dist\TempBar.exe TempBar-win-x64-selfcontained.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TempBar
          path: TempBar-win-x64*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TempBar-win-x64*.exe
          generate_release_notes: true
          body: |
            - `TempBar-win-x64.exe`: small build, needs the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0).
            - `TempBar-win-x64-selfcontained.exe`: no prerequisites.

            CPU temperature needs the PawnIO driver: `winget install namazso.PawnIO`
